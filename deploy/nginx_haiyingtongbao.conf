# 海盈通保OA管理系统 —— nginx 生产配置（HTTPS + 反代 gunicorn）
#
# 用法（Linux）：
#   1. 把本文件放到 /etc/nginx/conf.d/haiyingtongbao.conf
#   2. 把下列所有 <你的域名> 换成真实域名（如 oa.haiyingtongbao.com）
#   3. 用 certbot 申请证书后，ssl_certificate 路径会自动生成（见下方注释）
#   4. nginx -t 检查语法 → systemctl reload nginx
#
# 企业微信硬性要求：应用主页必须是 https，且域名已完成 ICP 备案。

# ===== 80 端口：只做两件事——企微校验文件 + 全站跳 HTTPS =====
server {
    listen 80;
    server_name <你的域名>;

    # 企业微信「可信域名」校验文件：
    # 把企微后台下载的 WW_verify_XXXX.txt 放到 /var/www/wecom_verify/ 目录，
    # 企微访问 http://域名/WW_verify_XXXX.txt 即可通过校验。
    location ^~ /WW_verify_ {
        root /var/www/wecom_verify;
        default_type text/plain;
    }

    # 其余所有 http 请求 301 永久跳转到 https（强制加密）
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== 443 端口：HTTPS 反代到 gunicorn（127.0.0.1:5002）=====
server {
    listen 443 ssl http2;
    server_name <你的域名>;

    # ===== SSL 证书（Let's Encrypt / certbot 自动生成，路径形如）=====
    # 申请命令见 DEPLOY.md。证书到期前 certbot renew 会自动续期。
    ssl_certificate     /etc/letsencrypt/live/<你的域名>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<你的域名>/privkey.pem;

    # 安全加固（保留即可）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传大文件（OA 审批附件 / 发票图片 / 企微 JS-SDK 拍照上传）
    client_max_body_size 50m;

    # 反代到 gunicorn
    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        # 兼容以后可能用到的 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # （可选性能优化）静态文件改由 nginx 直接返回，减轻 gunicorn 负担。
    # 注意：alias 路径需与你项目实际 static 目录一致（Flask 默认在 项目根/static）。
    # 拿不准就删掉这段，上面的 location / 会全量反代，功能不受影响。
    # location /static {
    #     alias /var/www/haiyingtongbao/app/static;
    #     expires 7d;
    #     add_header Cache-Control "public";
    # }
}
