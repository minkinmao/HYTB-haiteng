<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>海盈通保OA · 登录中</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#FAF7F2;color:#5b4636;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .box{text-align:center}
  .spin{width:34px;height:34px;border:4px solid #E6823C;border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
  @keyframes s{to{transform:rotate(360deg)}}
  .tip{color:#9a8c7d;font-size:13px;margin-top:10px}
  .btn{margin-top:14px;padding:8px 20px;border:0;border-radius:6px;background:#C86432;color:#fff;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <div>正在登录海盈通保OA管理系统…</div>
  <div class="tip">若未自动跳转，请点击下方按钮</div>
  <form id="f" method="post" action="http://127.0.0.1:5002/login" target="_self">
    <input type="hidden" name="username" value="admin">
    <input type="hidden" name="password" value="123456">
    <button type="submit" class="btn">进入系统</button>
  </form>
</div>
<script>
  // 页面加载后自动提交登录表单，完成一键登录
  window.onload = function () { document.getElementById('f').submit(); };
</script>
</body>
</html>
