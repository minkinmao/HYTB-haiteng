{% extends 'base.html' %}
{% set page_title = '重置密码' %}
{% block content %}
<style>
  .pwcard{max-width:460px;margin:10px auto}
  .fld{margin-bottom:16px}
  .fld label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
  .fld input{width:100%;padding:10px 12px}
</style>

<div class="card pwcard" style="padding:26px 28px">
  <h2 style="margin:0 0 4px">重置密码 · {{ u.username }}</h2>
  <p style="color:var(--ink-2);font-size:13px;margin:0 0 20px">管理员可直接重置该账号密码，无需原密码（适用于员工忘记密码等场景）。</p>
  <form method="post" autocomplete="off">
    <div class="fld">
      <label>新密码（至少 6 位）</label>
      <input type="password" name="new_password" autocomplete="new-password" required>
    </div>
    <div class="fld">
      <label>确认新密码</label>
      <input type="password" name="confirm_password" autocomplete="new-password" required>
    </div>
    <button class="btn" type="submit">确认重置</button>
    <a href="{{ url_for('admin.users') }}" style="margin-left:12px;color:var(--ink-2)">返回</a>
  </form>
</div>
{% endblock %}
