{% extends 'base.html' %}
{% set page_title = '修改密码' %}
{% block content %}
<style>
  .pwcard{max-width:460px;margin:10px auto}
  .fld{margin-bottom:16px}
  .fld label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
  .fld input{width:100%;padding:10px 12px}
</style>

<div class="card pwcard" style="padding:26px 28px">
  <h2 style="margin:0 0 4px">修改登录密码</h2>
  <p style="color:var(--ink-2);font-size:13px;margin:0 0 20px">为安全起见，修改密码需先验证当前密码。</p>
  <form method="post" autocomplete="off">
    <div class="fld">
      <label>当前密码</label>
      <input type="password" name="current_password" autocomplete="current-password" required>
    </div>
    <div class="fld">
      <label>新密码（至少 6 位）</label>
      <input type="password" name="new_password" autocomplete="new-password" required>
    </div>
    <div class="fld">
      <label>确认新密码</label>
      <input type="password" name="confirm_password" autocomplete="new-password" required>
    </div>
    <button class="btn" type="submit">确认修改</button>
    <a href="{{ url_for('home') }}" style="margin-left:12px;color:var(--ink-2)">取消</a>
  </form>
</div>
{% endblock %}
