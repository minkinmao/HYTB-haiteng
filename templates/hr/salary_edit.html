{% extends 'base.html' %}
{% block title %}编辑工资 · 海盈通保{% endblock %}
{% block content %}
  <h2 style="font-size:18px;margin:0 0 16px">
    编辑工资记录
  </h2>

  <div style="background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(42,42,42,.05)">
    <form method="post" action="{{ url_for('hr.salary_update', sid=s.id) }}"
          style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end">
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">员工 *</div>
        <select name="employee_id" required style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px">
          {% for e in employees %}<option value="{{ e.id }}" {{ 'selected' if e.id==s.employee_id }}>{{ e.name }}（{{ e.employee_no }}）</option>{% endfor %}
        </select></div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">发放月份 *</div>
        <input name="month" required value="{{ s.month or '' }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px;width:120px"></div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">基本薪资</div>
        <input name="base_salary" type="number" step="0.01" value="{{ s.base_salary or 0 }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px;width:110px"></div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">岗位工资</div>
        <input name="position_salary" type="number" step="0.01" value="{{ s.position_salary or 0 }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px;width:110px"></div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">绩效薪资</div>
        <input name="performance_salary" type="number" step="0.01" value="{{ s.performance_salary or 0 }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px;width:110px"></div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">补贴</div>
        <input name="subsidy" type="number" step="0.01" value="{{ s.subsidy or 0 }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px;width:110px"></div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">养老保险</div>
        <input name="pension" type="number" step="0.01" value="{{ s.pension or 0 }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px;width:110px"></div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">医疗保险</div>
        <input name="medical" type="number" step="0.01" value="{{ s.medical or 0 }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px;width:110px"></div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">住房公积金</div>
        <input name="housing_fund" type="number" step="0.01" value="{{ s.housing_fund or 0 }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px;width:110px"></div>
      {% for f in salary_fields %}
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">{{ f.name }}{% if f.is_deduction %}(扣减){% endif %}</div>
        <input name="custom_{{ f.code }}" type="number" step="0.01" value="{{ (s.custom or {}).get(f.code) or 0 }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px;width:110px"></div>
      {% endfor %}
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">备注</div>
        <input name="note" value="{{ s.note or '' }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px;width:160px"></div>
      <button type="submit"
              style="background:#E6823C;color:#fff;border:none;padding:9px 24px;border-radius:6px;font-size:14px;cursor:pointer">保存</button>
    </form>
  </div>
{% endblock %}
