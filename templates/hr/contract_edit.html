{% extends 'base.html' %}
{% block title %}编辑合同 · 海盈通保{% endblock %}
{% block content %}
  <h2 style="font-size:18px;margin:0 0 16px">编辑合同
  </h2>
  <div style="background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(42,42,42,.05)">
    <form method="post" action="{{ url_for('hr.contract_update', cid=c.id) }}" enctype="multipart/form-data" style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end">
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">员工 *</div>
        <select name="employee_id" required style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px">
          {% for e in employees %}<option value="{{ e.id }}" {{ 'selected' if e.id==c.employee_id }}>{{ e.name }}（{{ e.employee_no }}）</option>{% endfor %}
        </select></div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">合同编号</div>
        <input name="contract_no" value="{{ c.contract_no or '' }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px"></div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">起始日</div>
        <input type="date" name="start_date" value="{{ c.start_date or '' }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px"></div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">到期日</div>
        <input type="date" name="end_date" value="{{ c.end_date or '' }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px"></div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">状态</div>
        <select name="status" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px">
          <option value="active" {{ 'selected' if c.status=='active' }}>生效中</option>
          <option value="expired" {{ 'selected' if c.status=='expired' }}>已到期</option>
        </select></div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">电子版合同</div>
        <input type="file" name="contract_file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.xls,.xlsx" style="font-size:13px">
        {% if c.file_name %}<div style="font-size:11px;color:#166534;margin-top:3px">已有备份：<a href="{{ url_for('hr.contract_download', cid=c.id) }}">下载</a>（重传会替换）</div>{% endif %}
      </div>
      <div><div style="font-size:12px;color:#9C9288;margin-bottom:4px">文件/备注</div>
        <input name="file_path" value="{{ c.file_path or '' }}" style="padding:8px 10px;border:1px solid #E2D8CA;border-radius:6px;font-size:14px;width:180px"></div>
      <button type="submit" style="background:#E6823C;color:#fff;border:none;padding:9px 24px;border-radius:6px;font-size:14px;cursor:pointer">保存</button>
    </form>
  </div>
{% endblock %}
