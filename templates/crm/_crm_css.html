{# 核心业务（CRM）模块共用样式（各页面 {% include 'crm/_crm_css.html' %} 引入） #}
<style>
  .crm-tool{background:#fff;border:1px solid #EAE2D6;border-radius:14px;padding:14px 18px;
            box-shadow:0 2px 12px rgba(42,42,42,.05);margin-bottom:16px;
            display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .crm-tool label{font-size:13px;color:#6B5D4F}
  .crm-tool input,.crm-tool select{padding:8px 10px;border:1px solid #E2D8CA;border-radius:8px;
            font-size:13px;background:#fff;color:#2A2A2A}
  .crm-tool input{min-width:180px}
  .crm-btn{padding:8px 18px;border-radius:8px;font-size:13px;border:1px solid #E2D8CA;
           background:#fff;color:#6B5D4F;cursor:pointer;text-decoration:none;display:inline-block}
  .crm-btn:hover{border-color:#E5B58C;color:#C86432}
  .crm-btn.pri{background:#9C4E2C;color:#fff;border-color:#9C4E2C;font-weight:600}
  .crm-btn.pri:hover{background:#7E3C20;color:#fff}
  .crm-btn.dark{background:#2A2A2A;color:#fff;border-color:#2A2A2A;font-weight:600}
  .crm-btn.dark:hover{background:#3B3B3B;color:#fff}
  .crm-btn.sm{padding:5px 12px;font-size:12.5px}
  .crm-spacer{flex:1}
  .crm-card{background:#fff;border:1px solid #EAE2D6;border-radius:14px;padding:6px 18px 14px;
            box-shadow:0 2px 12px rgba(42,42,42,.05)}
  /* 表格宽度自适应：列宽按内容自然分配（不硬挤、不固定百分比），容器富余时铺满，内容超宽时横向滚动 */
  .crm-table{width:auto;min-width:100%;border-collapse:collapse;font-size:13px;table-layout:auto}
  .crm-table th{text-align:left;font-weight:600;color:#6B5D4F;background:#FAF7F2;font-size:12.5px;
                padding:10px;border-bottom:1px solid #EAE2D6;white-space:nowrap}
  .crm-table th:first-child{border-radius:8px 0 0 8px}
  .crm-table th:last-child{border-radius:0 8px 8px 0}
  .crm-table td{padding:10px;border-bottom:1px solid #F5F0E8;vertical-align:middle}
  .crm-table tbody tr:hover{background:#FFFCF8}
  .crm-table td.mono{font-variant-numeric:tabular-nums;color:#6B5D4F;white-space:nowrap}
  .crm-table td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .crm-nm{font-size:13.5px;font-weight:600;color:#2A2A2A}
  .crm-sub{font-size:12px;color:#9C9288;margin-top:2px}
  .crm-tag{font-size:11px;padding:2px 9px;border-radius:9px;white-space:nowrap;display:inline-block}
  .t-ok{background:#dcfce7;color:#166534}
  .t-warn{background:#FDF3E4;color:#8A5A18}
  .t-danger{background:#FBE3DD;color:#991b1b}
  .t-gray{background:#EEE9E1;color:#6B5D4F}
  .t-info{background:#E7EDFA;color:#4A6BB0}
  .t-brand{background:#F6E5DC;color:#9C4E2C}
  .crm-a{color:#9C4E2C;text-decoration:none}
  .crm-a:hover{text-decoration:underline}
  .crm-del{background:none;border:none;color:#991b1b;font-size:12.5px;cursor:pointer;padding:0}
  .crm-empty{padding:40px 0;text-align:center;color:#9C9288;font-size:13.5px}
  .crm-form{background:#fff;border:1px solid #EAE2D6;border-radius:14px;padding:22px 24px;
            box-shadow:0 2px 12px rgba(42,42,42,.05);max-width:1680px}
  .crm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px}
  .crm-fld{display:flex;flex-direction:column;gap:6px;min-width:0}
  .crm-fld.full{grid-column:1/-1}
  .crm-fld label{font-size:12.5px;color:#6B5D4F}
  .crm-fld label b{color:#C86432;font-weight:400}
  .crm-fld input,.crm-fld select,.crm-fld textarea{padding:9px 11px;border:1px solid #E2D8CA;
            border-radius:8px;font-size:13.5px;background:#fff;color:#2A2A2A;width:100%;
            box-sizing:border-box;font-family:inherit}
  .crm-fld textarea{resize:vertical;min-height:68px}
  .crm-fld input:focus,.crm-fld select:focus,.crm-fld textarea:focus{outline:none;border-color:#E5B58C;
            box-shadow:0 0 0 3px rgba(230,130,60,.12)}
  .crm-fld input[readonly]{background:#FAF7F2;color:#6B5D4F}
  .crm-fld .hint{font-size:11.5px;color:#9C9288}
  .crm-acts{display:flex;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid #F0E9DE}
  .crm-sec{font-size:14px;font-weight:600;color:#9C4E2C;margin:24px 0 12px;
           padding-bottom:8px;border-bottom:1px dashed #E8DCCE;display:flex;align-items:center;gap:8px}
  .crm-sec:first-child{margin-top:4px}
  .crm-sec span{font-size:11.5px;font-weight:400;color:#9C9288}
  .crm-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .crm-kpi{background:#fff;border:1px solid #EAE2D6;border-radius:12px;padding:14px 16px;
           box-shadow:0 2px 10px rgba(42,42,42,.04)}
  .crm-kpi .k{font-size:12px;color:#9C9288}
  .crm-kpi .v{font-size:22px;font-weight:600;color:#9C4E2C;margin-top:4px;
              font-variant-numeric:tabular-nums}
  .crm-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .crm-tab{padding:8px 18px;border-radius:10px;font-size:13px;text-decoration:none;
           border:1px solid #E2D8CA;background:#fff;color:#6B5D4F}
  .crm-tab:hover{border-color:#E5B58C;color:#C86432}
  .crm-tab.on{background:#9C4E2C;border-color:#9C4E2C;color:#fff;font-weight:600}
  .crm-tab .n{font-size:11.5px;opacity:.85;margin-left:4px}
  .crm-info{background:#fff;border:1px solid #EAE2D6;border-radius:14px;padding:6px 18px 16px;
            box-shadow:0 2px 12px rgba(42,42,42,.05);margin-bottom:16px}
  .crm-info dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 24px;margin:0}
  .crm-info .rw{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #F5F0E8;font-size:13px}
  .crm-info .rw .l{color:#9C9288;min-width:112px}
  .crm-info .rw .v{color:#2A2A2A;word-break:break-all}
  .crm-rate{font-variant-numeric:tabular-nums;white-space:nowrap}
  .crm-rate.pct::after{content:'%';font-size:11px;color:#9C9288;margin-left:1px}
  .crm-hl{color:#9C4E2C;font-weight:600}

  /* ===== 十改：「合约」与「方案」两套视觉语言（全模块统一，总总/分分一致）=====
     ① 产品合约费用政策 = 蓝青 · 实线 · 稳定（一定时段内不变）
     ② 保司阶段产品方案政策 = 暖橙 · 虚线 · 变动（可多条、可增删）
     一眼能分出「这是合约数据 / 那是方案数据」，不再混在一起看。
     总总 / 分分用同一套配色，只靠标题里的口径标签区分。 */
  .crm-block{border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .crm-block:last-child{margin-bottom:0}
  .crm-block > .blk-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
      margin-bottom:10px;padding-bottom:8px;font-size:13.5px;font-weight:600}
  .crm-block > .blk-hd .sp{flex:1}
  .blk-no{width:20px;height:20px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;
      display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:1}
  .blk-tag{font-size:10.5px;font-weight:400;padding:1px 8px;border-radius:8px;white-space:nowrap;
      background:#EEE9E1;color:#6B5D4F}
  .blk-note{font-size:11.5px;font-weight:400;color:#9C9288}
  /* ① 合约：蓝青实线 */
  .blk-contract{background:#F4F8FC;border:1px solid #D7E3F0;border-left:4px solid #3E7CB8}
  .blk-contract > .blk-hd{color:#2F6BA8;border-bottom:1px dashed #D7E3F0}
  .blk-contract .blk-no{background:#3E7CB8}
  .blk-contract .blk-tag{background:#E3EDF8;color:#2F6BA8}
  /* ② 方案：暖橙虚线 */
  .blk-plan{background:#FDF7F1;border:1.5px dashed #EBCFAE;border-left:4px solid #C86432}
  .blk-plan > .blk-hd{color:#9C4E2C;border-bottom:1px dashed #F0DCC6}
  .blk-plan .blk-no{background:#C86432}
  .blk-plan .blk-tag{background:#F8E6D9;color:#9C4E2C}
  /* 列表 / 详情里给「合约」「方案」数据打的标签 */
  .t-contract{background:#E3EDF8;color:#2F6BA8}
  .t-plan{background:#F8E6D9;color:#9C4E2C}
  /* 三十九改：组件产品代码「历史带出 → 只读」 */
  input.comp-code.ro{background:#F3EFE8;color:#6B6259;border-color:#E0D8CB;
    cursor:not-allowed;font-weight:600}
  .cc-unlock{padding:1px 8px;margin-left:6px;font-size:12px;line-height:18px;
    border:1px solid #E0C7A8;border-radius:9px;background:#FDF7F1;color:#9C4E2C;
    cursor:pointer;vertical-align:middle}
  .cc-unlock:hover{background:#F8E6D9;border-color:#C86432}
  /* 四十二改：省分公司一键抓取 —— 表格内的文字按钮 + 缺项提示条 */
  button.crm-lnk{background:none;border:0;padding:0;margin-left:8px;color:#C86432;
    font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap}
  button.crm-lnk:hover{text-decoration:underline}
  .miss-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;
    background:#FDF6EE;border:1px solid #E8C9A6;border-left:4px solid #D98324;
    border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 14px;color:#6B4A2A}
  .miss-bar b{color:#B5532A}
  .miss-bar .tip{font-size:12.5px;color:#9C9288}
</style>
